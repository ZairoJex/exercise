[project]
name = "ai-agent-road"
version = "0.1.0"
description = "16-week zero-to-job AI Agent learning workspace"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.5,<2",
    "fastapi[standard]>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "langchain-core>=1.6,<2",
    "langgraph>=1.2,<2",
    "mcp[cli]>=2,<3",
    "openai>=3.3,<4",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "rank-bm25>=0.2.2,<0.3",
    "tenacity>=9.1,<10",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
]
